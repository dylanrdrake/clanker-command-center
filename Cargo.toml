[package]
name = "clanker-command-center"
version = "0.1.0"
edition = "2021"
description = "An OpenAI-compatible CLI frontend for any LLM provider"

[[bin]]
name = "clank"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
rustyline = "13.0"
home = "0.5"
anyhow = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
aes-gcm = "0.10"
base64 = "0.22"
textwrap = { version = "0.16", features = ["terminal_size"] }
futures-util = "0.3"
async-stream = "0.3"
# `crossterm_0_29` keeps ratatui's vendored backend on the same crossterm
# version we depend on directly for its async EventStream.
# `unstable-rendered-line-info` exposes Paragraph::line_count, the only way to
# measure wrapped height with ratatui's own wrapper. Still needed for the
# boxes that ratatui wraps — the approval prompt and the `$` output — where
# the box has to be sized before it is drawn. The transcript no longer uses
# it: its rows are wrapped by hand, so its height is just the row count.
ratatui = { version = "0.30.2", features = [
    "crossterm_0_29",
    "unstable-rendered-line-info",
] }
crossterm = { version = "0.29", features = ["event-stream"] }
tui-markdown = "0.3.9"
# Pattern matching for `search_files`. Already in the tree behind
# `tui-markdown`, so naming it here costs a line rather than a build.
regex = "1"
# Directory walking for `search_files`. Symlinks are not followed, which is
# what stops a cyclic link turning a search into an infinite one.
walkdir = "2"
# Display width, not character count. The transcript's rows are wrapped by
# hand and then rendered without ratatui's own wrapper, so a row that
# measures short and draws wide is clipped rather than re-wrapped — and an
# emoji or a CJK glyph in a reply is exactly that case.
unicode-width = "0.2"
# HTML to readable text for `web_fetch`. html5ever-backed, so entities,
# tables and malformed markup survive the conversion — the point of the
# tool is handing the model prose instead of a page of markup.
html2text = "0.17.1"
# Asks the terminal whether it's light or dark, via OSC 11, so the
# selection band is a shade darker on a dark theme and lighter on a light
# one. COLORFGBG is unset on most modern terminals, which is why this
# needs a real query rather than an environment variable.
terminal-colorsaurus = "1.0.3"

[profile.release]
opt-level = 3
lto = true
